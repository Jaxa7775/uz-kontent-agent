name: Kanal navbati

on:
  schedule:
    - cron: "7 * * * *"        # ZAXIRA: har soatda :07 da (UTC). Ishonchsiz - GitHub ba'zan soatlab
                               # o'tkazib yuboradi. Asosiy taymer - cron-job.org (README).
  workflow_dispatch:
    inputs:
      rejim:
        description: "joyla - vaqti kelganlarni joylash; tekshir - bot va kanalni tekshirish"
        type: choice
        options: [joyla, tekshir]
        default: joyla

permissions:
  contents: write

concurrency:
  group: kanal-navbat
  cancel-in-progress: false

jobs:
  joyla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # ishga tushgan paytdagi eng oxirgi holat: navbatda kutgan ikkinchi ish oldingisi
          # joylagan postni eski nusxadan qayta yubormasin
          ref: ${{ github.ref_name }}

      - name: Vaqti kelgan postlarni joylash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_KANAL: ${{ vars.TELEGRAM_KANAL }}
          REJIM: ${{ github.event.inputs.rejim }}
        run: |
          if [ "$REJIM" = "tekshir" ]; then
            python3 navbat.py --tekshir
          else
            python3 navbat.py
          fi

      - name: Navbat holatini saqlash
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "kanal-navbat"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "navbat: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
